<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose New Password · e-Sweets</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="passwordTitle">
        <h1 id="passwordTitle">Choose a new password</h1>
        <p class="auth-subtitle">Use at least eight characters.</p>
        <div class="auth-error-banner" id="errorBanner" role="alert"></div>
        <div class="auth-info-banner" id="infoBanner" role="status"></div>
        <form id="passwordForm" novalidate method="post" action="javascript:void(0)">
          <div class="auth-field">
            <label for="password">New password</label>
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <button class="auth-submit" id="submitButton" type="submit">
            Update password
          </button>
        </form>
      </section>
    </main>
    <script type="module" src="js/update-password.js"></script>
  </body>
</html>
