<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose New Password · e-Sweets</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="passwordTitle">
        <h1 id="passwordTitle">Choose a new password</h1>
        <p class="auth-subtitle">Use at least eight characters.</p>
        <div class="auth-error-banner" id="errorBanner" role="alert"></div>
        <div class="auth-info-banner" id="infoBanner" role="status"></div>
        <form id="passwordForm" novalidate>
          <div class="auth-field">
            <label for="password">New password</label>
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <button class="auth-submit" id="submitButton" type="submit">
            Update password
          </button>
        </form>
      </section>
    </main>
    <script type="module">
      import { updatePassword } from "./js/auth.js";

      const form = document.getElementById("passwordForm");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const submitButton = document.getElementById("submitButton");
      const errorBanner = document.getElementById("errorBanner");
      const infoBanner = document.getElementById("infoBanner");

      async function handlePasswordUpdate(event) {
        event.preventDefault();
        errorBanner.style.display = "none";

        if (password.value.length < 8) {
          errorBanner.textContent = "Password must be at least 8 characters.";
          errorBanner.style.display = "block";
          return;
        }

        if (password.value !== confirmPassword.value) {
          errorBanner.textContent = "Passwords do not match.";
          errorBanner.style.display = "block";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Updating…";

        try {
          await updatePassword(password.value);
          infoBanner.textContent =
            "Password updated. You can continue to your account.";
          infoBanner.style.display = "block";
          form.reset();
          setTimeout(() => window.location.replace("account.html"), 1200);
        } catch (error) {
          errorBanner.textContent = error.message;
          errorBanner.style.display = "block";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Update password";
        }
      }

      form.addEventListener("submit", handlePasswordUpdate);
    </script>
  </body>
</html>
