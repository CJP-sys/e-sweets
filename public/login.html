<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In · Sweets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css?v=20260804" />
  </head>
  <body class="login-screen">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="loginTitle">
        <a class="login-brand" href="index.html" aria-label="e-Sweets home">
          <span class="login-brand-mark" aria-hidden="true">e</span>
          <span>e-Sweets<small>BAKED WITH JOY</small></span>
        </a>

        <div class="login-form-wrap">
          <p class="auth-kicker">WELCOME HOME</p>
          <h1 id="loginTitle">Welcome back</h1>
          <p class="auth-subtitle">Please enter your details.</p>

          <div class="auth-error-banner" id="errorBanner" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="auth-field">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
              />
              <div class="auth-field-error" id="emailError"></div>
            </div>

            <div class="auth-field">
              <div class="login-label-row">
                <label for="password">Password</label>
                <a href="forgot-password.html">Forgot password?</a>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
              />
              <div class="auth-field-error" id="passwordError"></div>
            </div>

            <button type="submit" class="auth-submit" id="submitBtn">
              Sign in
            </button>
          </form>

          <div class="auth-switch">
            Don't have an account? <a href="register.html">Sign up</a>
          </div>
        </div>

        <p class="login-footer">Freshly baked moments, made for you.</p>
      </section>

      <aside class="login-visual" aria-label="Fresh e-Sweets cake and pastries">
        <img
          src="assets/images/login-sweets.webp"
          alt="Pink celebration cake with croissants and macarons"
        />
        <div class="login-visual-overlay">
          <p>BAKED WITH CARE</p>
          <h2>Sweet moments start here.</h2>
          <span
            >Sign in to save your profile and continue your e-Sweets
            journey.</span
          >
        </div>
      </aside>
    </main>

    <script type="module">
      import { getCustomerProfile, loginUser } from "./js/auth.js";

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const errorBanner = document.getElementById("errorBanner");
      const submitBtn = document.getElementById("submitBtn");

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      function clearErrors() {
        emailError.textContent = "";
        passwordError.textContent = "";
        emailInput.classList.remove("invalid");
        passwordInput.classList.remove("invalid");
        errorBanner.style.display = "none";
        errorBanner.textContent = "";
      }

      function validate() {
        let valid = true;

        if (!emailInput.value.trim()) {
          emailError.textContent = "Email is required.";
          emailInput.classList.add("invalid");
          valid = false;
        } else if (!isValidEmail(emailInput.value.trim())) {
          emailError.textContent = "Enter a valid email address.";
          emailInput.classList.add("invalid");
          valid = false;
        }

        if (!passwordInput.value) {
          passwordError.textContent = "Password is required.";
          passwordInput.classList.add("invalid");
          valid = false;
        }

        return valid;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        if (!validate()) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const user = await loginUser(
            emailInput.value.trim(),
            passwordInput.value,
          );

          if (!user.email_confirmed_at) {
            sessionStorage.setItem(
              "esweets-verification-email",
              user.email || "",
            );
            window.location.href = "verify-email.html";
            return;
          }

          const profile = await getCustomerProfile(user.id);
          window.location.href =
            profile.role === "owner" ? "owner.html" : "account.html";
        } catch (err) {
          if (err.code === "email_not_confirmed") {
            window.location.href = "verify-email.html";
            return;
          }
          errorBanner.textContent = err.message;
          errorBanner.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
        }
      });
    </script>
  </body>
</html>
